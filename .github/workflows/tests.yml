name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libxkbcommon-x11-0 libdbus-1-3 libgl1 libglvnd0 libglvnd-dev libgl1-mesa-dri libxcb-glx0 || true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade "pip==26.1.2"
        pip install --only-binary :all: "pytest==9.0.3" "pytest-cov==7.1.0" "pytest-mock==3.15.1"
        pip install --only-binary :all: -r requirements-ci.txt

    - name: Run unit tests with pytest
      run: |
        mkdir -p build
        if [ "$RUNNER_OS" = "Linux" ]; then
          xvfb-run -a pytest tests/unit --cov=src --cov-fail-under=80 --cov-report=xml:build/coverage.xml --cov-report=term-missing
        else
          pytest tests/unit --cov=src --cov-fail-under=80 --cov-report=xml:build/coverage.xml --cov-report=term-missing
        fi
      shell: bash

    - name: Run integration tests with pytest
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          xvfb-run -a pytest tests/integration/ -v --tb=short
        else
          pytest tests/integration/ -v --tb=short
        fi
      shell: bash

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./build/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  sonarcloud:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade "pip==26.1.2"
        pip install --only-binary :all: "pytest==9.0.3" "pytest-cov==7.1.0" "pytest-mock==3.15.1"
        pip install --only-binary :all: -r requirements-ci.txt

    - name: Run tests with coverage
      run: |
        mkdir -p build
        pytest tests/unit --cov=src --cov-report=xml:build/coverage.xml --cov-report=term-missing

    - name: SonarCloud Scan
      uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install linting and type checking tools
      run: |
        python -m pip install --upgrade "pip==26.1.2"
        pip install --only-binary :all: "mypy==2.1.0" "pyright==1.1.409" "ruff==0.15.13" "vulture==2.16" "flake8==7.3.0" "pylint==4.0.5" "black==26.5.1"
        pip install --only-binary :all: -r requirements-ci.txt

    - name: Type checking with mypy
      run: mypy --strict src/
      continue-on-error: false

    - name: Type checking with pyright
      run: pyright src/
      continue-on-error: false

    - name: Lint with ruff
      run: ruff check . --exclude venv,env,build,dist,release
      continue-on-error: false

    - name: Dead code detection with vulture
      run: vulture src/ --exclude venv,tests,build,dist,release
      continue-on-error: true

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,env,build,dist,release
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=venv,env,build,dist,release
      continue-on-error: false

    - name: Check code formatting with black
      run: black --check . --target-version py312 --exclude='(venv|env|\.venv|release|\.git)'
      continue-on-error: false

  coverage-badge:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade "pip==26.1.2"
        pip install --only-binary :all: "pytest==9.0.3" "pytest-cov==7.1.0" "pytest-mock==3.15.1"
        pip install --only-binary :all: -r requirements-ci.txt

    - name: Run unit tests and extract coverage
      run: |
        pytest tests/unit --cov=. --cov-report=term --cov-report=json
        # Extract coverage percentage from coverage.json
        COVERAGE=$(python -c "import json; data=json.load(open('coverage.json')); print(int(data['totals']['percent_covered']))")
        echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV

    - name: Update README with coverage badge
      run: |
        # Replace codecov badge with pytest coverage badge
        sed -i 's|!\[codecov\].*codecov\.io[^)]*)|![pytest-coverage](https://img.shields.io/badge/coverage-'$COVERAGE'%25-brightgreen.svg)|' README.md
        # Also remove old Coverage badge line if it exists
        sed -i '/!\[Coverage\].*codecov/d' README.md

    - name: Commit and push badge update
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        if git diff --quiet README.md; then
          echo "No changes to commit"
        else
          git add README.md
          git commit -m "ci: Update coverage badge to $COVERAGE% (pytest)"
          git push origin master
        fi
