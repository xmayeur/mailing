name: Build and Release Executables

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Enter the version (e.g., v1.0.0)"
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build executable
        run: pyinstaller editor.spec

      - name: Package non-macOS build
        if: runner.os != 'macOS'
        shell: bash
        run: |
          python - <<'PY'
          import shutil
          import os
          from pathlib import Path

          root = Path("dist")
          archive_name = f"sendMailEditor-{os.environ['RUNNER_OS'].lower()}"
          shutil.make_archive(str(root / archive_name), "zip", root_dir=root, base_dir="sendMailEditor")
          PY

      - name: Create macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release/sendMailEditor-macos
          cp -R dist/sendMailEditor.app release/sendMailEditor-macos/sendMailEditor.app
          printf 'Unsigned macOS package for sendMailEditor.\nRun the app from Finder after mounting this DMG.\n' > release/sendMailEditor-macos/README.txt
          hdiutil create \
            -volname "sendMailEditor" \
            -srcfolder release/sendMailEditor-macos \
            -ov \
            -format UDZO \
            dist/sendMailEditor-macos.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sendMailEditor-${{ matrix.os }}
          path: |
            dist/sendMailEditor-*.zip
            dist/sendMailEditor-macos.dmg
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Make files executable (Linux/Mac)
        run: chmod +x sendMailEditor-* || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          draft: false
          prerelease: false
          files: |
            sendMailEditor-linux.zip
            sendMailEditor-windows.zip
            sendMailEditor-macos.dmg
