name: Build and Release Executables

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      tag: ${{ steps.extract.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Extract version from pyproject.toml
        id: extract
        run: |
          version=$(grep 'version = ' pyproject.toml | head -1 | cut -d'"' -f2)
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "tag=v$version" >> $GITHUB_OUTPUT

  build:
    needs: version
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        timeout-minutes: 10

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libxcb-xinerama0 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0

      - name: Install runtime dependencies
        run: pip install --only-binary :all: -r requirements-ci.txt

      - name: Install build tools (Nuitka + PySide6)
        run: pip install nuitka==4.1.3 ordered-set zstandard "PySide6==6.11.1"

      - name: Convert icon to ICNS (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p images/mail.iconset
          sips -z 16   16   images/mail.png --out images/mail.iconset/icon_16x16.png
          sips -z 32   32   images/mail.png --out images/mail.iconset/icon_32x32.png
          sips -z 128  128  images/mail.png --out images/mail.iconset/icon_128x128.png
          sips -z 256  256  images/mail.png --out images/mail.iconset/icon_256x256.png
          sips -z 512  512  images/mail.png --out images/mail.iconset/icon_512x512.png
          iconutil -c icns images/mail.iconset -o images/mail.icns

      - name: Build executable
        timeout-minutes: 60
        env:
          QT_QPA_PLATFORM: offscreen   # headless Linux CI
        run: python build_editor.py

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd dist_nuitka
          7z a ../sendMailEditor-windows.zip editor.dist/

      - name: Package Linux build
        if: runner.os == 'Linux'
        run: |
          cd dist_nuitka
          tar czf ../sendMailEditor-linux.tar.gz editor.dist/
          zip -r ../sendMailEditor-linux.zip editor.dist/

      - name: Create macOS DMG
        if: runner.os == 'macOS'
        run: |
          mkdir -p release/sendMailEditor-macos
          cp -R dist_nuitka/editor.app release/sendMailEditor-macos/
          printf 'Unsigned macOS package for sendMailEditor.\nRun the app from Finder after mounting this DMG.\n' \
            > release/sendMailEditor-macos/README.txt
          hdiutil create \
            -volname "sendMailEditor" \
            -srcfolder release/sendMailEditor-macos \
            -ov \
            -format UDZO \
            sendMailEditor-macos.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sendMailEditor-${{ matrix.os }}
          path: |
            sendMailEditor-*.zip
            sendMailEditor-*.tar.gz
            sendMailEditor-macos.dmg
          if-no-files-found: ignore

  release:
    needs: [build, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          merge-multiple: true

      - name: Delete existing release assets (if version unchanged)
        run: |
          release_id=$(gh release view ${{ needs.version.outputs.tag }} --json id -q .id 2>/dev/null || echo "")
          if [ -n "$release_id" ]; then
            echo "Found existing release for ${{ needs.version.outputs.tag }}, will overwrite assets"
            gh release delete-asset ${{ needs.version.outputs.tag }} sendMailEditor-linux.zip -y 2>/dev/null || true
            gh release delete-asset ${{ needs.version.outputs.tag }} sendMailEditor-windows.zip -y 2>/dev/null || true
            gh release delete-asset ${{ needs.version.outputs.tag }} sendMailEditor-macos.dmg -y 2>/dev/null || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Make files executable (Linux/Mac)
        run: chmod +x sendMailEditor-* || true

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Release ${{ needs.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            sendMailEditor-linux.zip
            sendMailEditor-linux.tar.gz
            sendMailEditor-windows.zip
            sendMailEditor-macos.dmg
