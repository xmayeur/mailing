name: Build and Release Executables

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    # Build only the trusted master revision for this run. Ignore PR/fork runs
    # and stale Tests results; a newer master commit must pass its own Tests.
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'master' &&
        github.event.workflow_run.head_sha == github.sha))
    runs-on: ubuntu-latest
    steps:
      - name: Report trusted build revision
        env:
          BUILD_SHA: ${{ github.sha }}
        run: echo "Building trusted master revision $BUILD_SHA"

  version:
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      tag: ${{ steps.extract.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Extract version from pyproject.toml
        id: extract
        run: |
          version=$(grep 'version = ' pyproject.toml | head -1 | cut -d'"' -f2)
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "tag=v$version" >> $GITHUB_OUTPUT

  build:
    needs: [gate, version]
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
        timeout-minutes: 10

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libxcb-xinerama0 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0

      - name: Install poetry
        run: python -m pip install --upgrade "poetry>=2.0" "poetry-plugin-export"

      - name: Install runtime dependencies
        run: |
          poetry export -f requirements.txt --only main --output requirements-ci.txt
          pip install -r requirements-ci.txt

      - name: Install build tools (Nuitka)
        run: pip install nuitka==4.3.1 ordered-set zstandard

      - name: Convert icon to ICNS (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p images/mail.iconset
          sips -z 16   16   images/mail.png --out images/mail.iconset/icon_16x16.png
          sips -z 32   32   images/mail.png --out images/mail.iconset/icon_32x32.png
          sips -z 128  128  images/mail.png --out images/mail.iconset/icon_128x128.png
          sips -z 256  256  images/mail.png --out images/mail.iconset/icon_256x256.png
          sips -z 512  512  images/mail.png --out images/mail.iconset/icon_512x512.png
          iconutil -c icns images/mail.iconset -o images/mail.icns

      - name: Build executable
        timeout-minutes: 60
        env:
          QT_QPA_PLATFORM: offscreen   # headless Linux CI
        run: python build_editor.py

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd dist_nuitka
          7z a ../sendMailEditor-windows.zip editor.dist/

      - name: Package Linux build
        if: runner.os == 'Linux'
        run: |
          cd dist_nuitka
          tar czf ../sendMailEditor-linux.tar.gz editor.dist/
          zip -r ../sendMailEditor-linux.zip editor.dist/

      - name: Create macOS DMG
        if: runner.os == 'macOS'
        run: |
          mkdir -p release/sendMailEditor-macos
          cp -R dist_nuitka/editor.app release/sendMailEditor-macos/
          printf 'Unsigned macOS package for sendMailEditor.\nRun the app from Finder after mounting this DMG.\n' \
            > release/sendMailEditor-macos/README.txt
          hdiutil create \
            -volname "sendMailEditor" \
            -srcfolder release/sendMailEditor-macos \
            -ov \
            -format UDZO \
            sendMailEditor-macos.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sendMailEditor-${{ matrix.os }}
          path: |
            sendMailEditor-*.zip
            sendMailEditor-*.tar.gz
            sendMailEditor-macos.dmg
          if-no-files-found: ignore

  release:
    needs: [build, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          merge-multiple: true

      - name: Delete existing release assets (if version unchanged)
        run: |
          release_id=$(gh release view ${{ needs.version.outputs.tag }} --json id -q .id 2>/dev/null || echo "")
          if [ -n "$release_id" ]; then
            echo "Found existing release for ${{ needs.version.outputs.tag }}, will overwrite assets"
            gh release delete-asset ${{ needs.version.outputs.tag }} sendMailEditor-linux.zip -y 2>/dev/null || true
            gh release delete-asset ${{ needs.version.outputs.tag }} sendMailEditor-windows.zip -y 2>/dev/null || true
            gh release delete-asset ${{ needs.version.outputs.tag }} sendMailEditor-macos.dmg -y 2>/dev/null || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Make files executable (Linux/Mac)
        run: chmod +x sendMailEditor-* || true

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ needs.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            sendMailEditor-linux.zip
            sendMailEditor-linux.tar.gz
            sendMailEditor-windows.zip
            sendMailEditor-macos.dmg
