name: Build and Release Executables

on:
  #  push:
  #    tag:
  #      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Enter the version (e.g., v1.0.0)"
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build executable
        run: pyinstaller --onefile  --noconfirm  --collect-submodules  './googleDriveLib.py' sendMail.py

      - name: Create macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release/sendMail-macos
          cp dist/sendMail release/sendMail-macos/sendMail-macos
          chmod +x release/sendMail-macos/sendMail-macos
          printf 'Unsigned macOS package for sendMail.\nRun sendMail-macos from Terminal after mounting this DMG.\n' > release/sendMail-macos/README.txt
          hdiutil create \
            -volname "sendMail" \
            -srcfolder release/sendMail-macos \
            -ov \
            -format UDZO \
            dist/sendMail-macos.dmg

      - name: Rename executable
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            mv dist/sendMail.exe dist/sendMail-windows.exe
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            mv dist/sendMail dist/sendMail-linux
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            mv dist/sendMail dist/sendMail-macos
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sendMail-${{ matrix.os }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Add this to allow release creation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: List downloaded files (Debugging)
        run: ls -R

      - name: Make files executable (Linux/Mac)
        run: chmod +x sendMail-* || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          draft: false
          prerelease: false
          files: |
            sendMail-linux
            sendMail-windows.exe
            sendMail-macos.dmg
           
