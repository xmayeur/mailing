name: Build and Release Executables

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      tag: ${{ steps.extract.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract version from pyproject.toml
        id: extract
        run: |
          version=$(grep 'version = ' pyproject.toml | head -1 | cut -d'"' -f2)
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "tag=v$version" >> $GITHUB_OUTPUT

  build:
    needs: version
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        timeout-minutes: 10

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --only-binary :all: -r requirements-ci.txt # NOSONAR

      - name: Build executable
        run: pyinstaller editor.spec

      - name: Package non-macOS build
        if: runner.os != 'macOS'
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv sendMailEditor_bin.exe sendMailEditor.exe
            7z a sendMailEditor-windows.zip sendMailEditor.exe
          else
            mv sendMailEditor_bin sendMailEditor
            tar czf sendMailEditor-linux.tar.gz sendMailEditor
            zip -j sendMailEditor-linux.zip sendMailEditor
          fi

      - name: Build sendMailEditor.app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash scripts/wrap_onefile_as_app.sh . sendMailEditor_bin sendMailEditor images/mail.png be.sendmail.editor
          rm dist/sendMailEditor_bin

      - name: Create macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rm -rf release/sendMailEditor-macos
          mkdir -p release/sendMailEditor-macos
          cp -R dist/sendMailEditor.app release/sendMailEditor-macos/
          printf 'Unsigned macOS package for sendMailEditor.\nRun the app from Finder after mounting this DMG.\n' > release/sendMailEditor-macos/README.txt
          hdiutil create \
            -volname "sendMailEditor" \
            -srcfolder release/sendMailEditor-macos \
            -ov \
            -format UDZO \
            dist/sendMailEditor-macos.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sendMailEditor-${{ matrix.os }}
          path: |
            dist/sendMailEditor-*.zip
            dist/sendMailEditor-*.tar.gz
            dist/sendMailEditor-macos.dmg
          if-no-files-found: ignore

  release:
    needs: [build, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Delete existing release assets (if version unchanged)
        run: |
          # Check if release exists and delete old assets for same version
          release_id=$(gh release view ${{ needs.version.outputs.tag }} --json id -q .id 2>/dev/null || echo "")
          if [ -n "$release_id" ]; then
            echo "Found existing release for ${{ needs.version.outputs.tag }}, will overwrite assets"
            gh release delete-asset ${{ needs.version.outputs.tag }} sendMailEditor-linux.zip -y 2>/dev/null || true
            gh release delete-asset ${{ needs.version.outputs.tag }} sendMailEditor-windows.zip -y 2>/dev/null || true
            gh release delete-asset ${{ needs.version.outputs.tag }} sendMailEditor-macos.dmg -y 2>/dev/null || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Make files executable (Linux/Mac)
        run: chmod +x sendMailEditor-* || true

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Release ${{ needs.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            sendMailEditor-linux.zip
            sendMailEditor-linux.tar.gz
            sendMailEditor-windows.zip
            sendMailEditor-macos.dmg
