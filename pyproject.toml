[project]
name = "sendmail"
version = "1.1.5"
description = "Add your description here"
requires-python = ">=3.12, <4.0"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "google-api-python-client>=2.187.0",
    "gspread",
    "spamcheck>=1.0.4",
    "get-hc-secrets>=1.5.27",
    "oauth2client",
    "pillow>=12.1.1",
    "markdown2",
    "google-auth>=2.47.0",
    "google-auth-oauthlib>=1.2.2",
    "pyasn1>=0.6.2",
    "protobuf>=6.33.5",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "mypy (>=1.20.1,<2.0.0)",
    "pyright (>=1.1.408,<2.0.0)",
    "ruff (>=0.15.11,<0.16.0)",
    "update (>=0.0.1,<0.0.2)",
    "python-calamine (>=0.6.2,<0.7.0)",
    "pymarkdownlnt (>=0.9.36,<0.10.0)"

]

[dependency-groups]
dev = [
    "types-requests (>=2.33.0.20260408,<3.0.0.0)",
    "types-pyyaml (>=6.0.12.20260408,<7.0.0.0)",
    "behave (>=1.3.3,<2.0.0)"
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
