[project]
name = "sendmail"
version = "1.5.0"
description = "An application to create a mass mailing message and send it to a list of recipients in batch"
requires-python = ">=3.12, <3.15"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "google-api-python-client>=2.187.0",
    "gspread",
    "spamcheck>=1.0.4",
    "get-hc-secrets>=1.5.27",
    "oauth2client",
    "pillow>=12.2.0",
    "markdown2",
    "google-auth>=2.47.0",
    "google-auth-oauthlib>=1.2.2",
    "pyasn1>=0.6.3",
    "protobuf>=6.33.5",
    "update (>=0.0.1,<0.0.2)",
    "python-calamine (>=0.6.2,<0.7.0)",
    "pymarkdownlnt (>=0.9.36,<0.10.0)",
    "requests (>=2.33.0)",
    "pyyaml>=6.0.3",
    "PyQt6>=6.7.0",
    "PyQt6-WebEngine>=6.7.0",
    "html2text>=2024.2.26",
    "commitizen (>=4.13.10,<5.0.0)",
    "sphinx (>=9.1.0,<10.0.0)",
    "sphinx-rtd-theme (>=3.1.0,<4.0.0)",
    "pyinstaller (>=6.20.0,<7.0.0)",
]

[dependency-groups]
dev = [
    "types-requests (>=2.33.0.20260408,<3.0.0.0)",
    "types-pyyaml (>=6.0.12.20260408,<7.0.0.0)",
    "behave (>=1.3.3,<2.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "mypy (>=1.20.1,<2.0.0)",
    "pyright (>=1.1.408,<2.0.0)",
    "ruff (>=0.15.11,<0.16.0)",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["editor", "tests.test_editor"]
ignore_errors = true

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "semver"
version_provider = "uv"
update_changelog_on_bump = true
