[project]
name = "sendmail"
version = "1.9.0"
description = "An application to create a mass mailing message and send it to a list of recipients in batch"
requires-python = ">=3.12, <3.15"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "google-api-python-client>=2.187.0",
    "gspread",
    "spamcheck>=1.0.4",
    "get-hc-secrets>=1.5.27",
    "oauth2client",
    "pillow>=12.2.0",
    "markdown2",
    "google-auth>=2.47.0",
    "google-auth-oauthlib>=1.2.2",
    "pyasn1>=0.6.3",
    "protobuf>=6.33.5",
    "update (>=0.0.1,<0.0.2)",
    "python-calamine (>=0.6.2,<0.7.0)",
    "pymarkdownlnt (>=0.9.36,<0.10.0)",
    "requests (>=2.33.0)",
    "pyyaml>=6.0.3",
    "PyQt6>=6.7.0",
    "PyQt6-WebEngine>=6.7.0",
    "html2text>=2024.2.26",
    "commitizen (>=4.13.10,<5.0.0)",
    "sphinx (>=9.1.0,<10.0.0)",
    "sphinx-rtd-theme (>=3.1.0,<4.0.0)",
    "pyinstaller (>=6.20.0,<7.0.0)",
]


[dependency-groups]
dev = [
    "commitizen>=4.11.0,<5.0.0",
    "snakeviz>=2.2.2,<3.0.0",
    "locust (>=2.43.3,<3.0.0)",
    "ipykernel (>=7.2.0,<8.0.0)",
    "vulture (>=2.16,<3.0)",
    "types-requests (>=2.33.0.20260408,<3.0.0.0)",
    "types-pyyaml (>=6.0.12.20260408,<7.0.0.0)",
    "behave (>=1.3.3,<2.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "mypy (>=2.0.0,<3.0.0)",
    "pyright (>=1.1.408,<2.0.0)",
    "ruff (>=0.15.11,<0.16.0)",
]

testing = [# runtime tooling required to exercise the test suite
    "pytest>=9.0.2,<10.0.0",
    "pytest-mock>=3.15.1,<4.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "behave>=1.3.3,<2.0.0",
    "rapidfuzz>=3.14.3,<4.0.0",
    "jaraco.classes>=3.4.0,<4.0.0",
    "jaraco.context>=6.1.1,<7.0.0",
    "jaraco.functools>=4.4.0,<5.0.0",
    "pytest-httpx>=0.24.0,<1.0.0",
    "httpx>=0.27.0,<0.32.0",
    "defusedxml>=0.7.1,<1.0.0",
]

lint = [
    "types-requests>=2.32.4.20250913,<3.0.0",
    "types-pyyaml>=6.0.12.20250915,<7.0.0",
    "mypy>=2.0.0,<3.0.0",
    "pyright>=1.1.407,<2.0.0",
    "ruff>=0.14.10,<1.0.0",
    "pymarkdownlnt>=0.9.35",
    "lxml-stubs (>=0.5.1,<0.6.0)",
    "setuptools (>=82.0.1,<83.0.0)",
    "types-setuptools (>=82.0.0.20260408,<83.0.0.0)",
]

docs = [
    "sphinx (>=9.1.0,<10.0.0); python_version >= '3.12'",
    "sphinx-rtd-theme (>=3.1.0,<4.0.0); python_version >= '3.12'",
    "myst-parser (>=5.1.0,<6.0.0); python_version >= '3.12'",
    # pa11y (>=6.0.0) — Node.js CLI tool; install via: npm install -g pa11y
    # Required for SC-008 WCAG 2.1 Level AA accessibility verification
]

[tool.setuptools.package-dir]
"" = "src"
pyArchimate = "src/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
typeCheckingMode = "basic"
reportMissingImports = true
reportUnusedVariable = "error"
reportUnusedImport = "none" # ruff handles this
reportAttributeAccessIssue = "warning"
reportArgumentType = "information"
reportOptionalMemberAccess = "warning"
reportMissingTypeStubs = "none"  # lxml-stubs and types-setuptools installed; Pillow has no bundled stubs
reportUnknownMemberType = false
extraPaths = ["src", "scripts"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
]

[tool.mypy]
strict = true
mypy_path = "src"
explicit_package_bases = true
show_error_codes = true
ignore_missing_imports = false
allow_redefinition = false
check_untyped_defs = true
disallow_untyped_calls = false  # TODO(009-quality-uplift): Enable — 89 violations; deferred as stretch goal
disallow_untyped_defs = false  # TODO(009-quality-uplift): Enable — 162 violations; deferred as stretch goal
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disable_error_code = ["import-untyped"]
#plugins = [
#  "pydantic.mypy"
#]
exclude = [
]

[[tool.mypy.overrides]]
module = [
    "bs4",
    "getSecrets",
    "google.auth",
    "google.auth.transport",
    "google.auth.transport.requests",
    "google.oauth2",
    "google.oauth2.credentials",
    "google_auth_oauthlib",
    "google_auth_oauthlib.flow",
    "googleapiclient",
    "googleapiclient.discovery",
    "googleapiclient.errors",
    "googleapiclient.http",
    "gspread",
    "markdown2",
    "oauth2client",
    "oauth2client.service_account",
    "PIL",
    "PIL.*",
    "python_calamine",
    "PyQt6",
    "PyQt6.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W", "B", "C", "I", "S110", "A", "N", "ARG",
    # TODO(009-quality-uplift): Enable UP rule set — 124 violations exceed the 20-violation cap;
    # most are auto-fixable (ruff --fix) but UP042/UP032 need semantic review
    "UP",
    # TODO(009-quality-uplift): Enable PT rule set — 163 violations exceed cap;
    # primarily PT009 (unittest assertions) in legacy tests
    # "PT",
]
ignore = [
    "E501", # line too long — handled by formatter
    "N999", # pyArchimate is intentional CamelCase module name
    "UP042", # StrEnum requires Python 3.11+; project supports 3.10+
    "UP032"  # need semantic review
]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    "docs",
    "build",
    "dist",
    "release",
    "env",
    "ENV",
    "*.log",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "N999", "N817", "ARG"]  # S101: assertions OK in tests; N999: test files mirror camelCase reader/writer names; N817: ET is the canonical ElementTree alias; ARG: unused params are normal in BDD steps, mocks, and sentinel lambdas

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = [".", "src/"]  # "." lets tests use `from src.pyArchimate import …`; "src/pyArchimate" lets readers/writers use bare `from pyArchimate import …` fallback
testpaths = ["./tests"]
python_files = "*_test.py test_*.py *_spec.py"
addopts = """
 --cov=src
 --cov-report=xml:build/coverage.xml
 --cov-report=term-missing
--junitxml=build/unit-tests.xml
"""
cache_dir = "/tmp/.pytest_cache"


[tool.pytest-asyncio]
asyncio_default_fixture_loop_scope = "module"
asyncio_mode = "auto"

[tool.coverage.run]
branch = false
source = ["src"]
omit = [
    "tests/*",
    "src/setup.py",
]

[tool.coverage.report]
show_missing = true

[tool.coverage.html]
directory = "build/coverage-reports"

[tool.coverage.xml]
output = "build/coverage.xml"

[tool.behave]
paths = [
    "tests/features/"
]
tags = ["not @wip"]

[tool.pymarkdown]
# MD010 - no hard tabs
plugins.md010.enabled = true
# MD007 - unordered list indentation
plugins.md007.indent = 4
# MD004 - unordered list style
plugins.md004.style = "dash"

[tool.pymarkdown.plugins.md013]
line_length = 120

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
